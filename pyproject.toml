[project]
name = "medium-cotlet-mcp"
version = "1.0.0"
description = "Connect Medium to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Medium API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["medium", "medium api", "medium mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/medium-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=medium"
Source = "https://github.com/cotlet-connect/medium-mcp"

[project.scripts]
medium-cotlet-mcp = "medium_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"medium_agent.py" = "medium_agent.py"

[tool.hatch.build.targets.sdist]
include = ["medium_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
